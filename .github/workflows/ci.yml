name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -e '.[dev,gui]'
      - run: xvfb-run -a python -m unittest discover -s tests -v
      - run: python tools/check_public_tree.py
      - run: python tools/build_release.py
      - run: python -m twine check dist/*
