[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wincmd"
version = "0.2.0"
description = "A Python interpreter for Windows CMD and batch script compatibility"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cmd", "batch", "interpreter", "windows", "compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Shells",
]

[project.optional-dependencies]
gui = ["Pillow>=9.0"]
dev = ["build>=1.2", "twine>=5"]

[project.scripts]
pycmd = "pycmd.__main__:main"

[tool.setuptools]
packages = ["pycmd"]
include-package-data = true

[tool.setuptools.package-data]
pycmd = ["help_data.json"]
